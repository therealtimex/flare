<!-- @dsCard group="Operating surface" height=150 subtitle="Verification status and confidence, inline in a cell" -->
<style>body{margin:0;background:var(--surface-0);color:var(--ink);font-family:var(--font-sans)}.pv{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px}</style>
<div class="pv" style="display:grid;gap:12px;justify-items:start">
  <span class="fl-enrich"><span class="fl-verify" data-status="verified">Verified</span><span class="fl-conf" style="--v:96">96%</span></span>
  <span class="fl-enrich"><span class="fl-verify" data-status="pattern">Pattern</span><span class="fl-conf" style="--v:71">71%</span></span>
  <span class="fl-enrich"><span class="fl-verify" data-status="risky">Risky</span><span class="fl-conf" style="--v:48" data-level="low">48%</span></span>
  <span class="fl-enrich"><span class="fl-verify" data-status="bounced">Bounced</span><span class="fl-conf" style="--v:100">100%</span></span>
  <span class="fl-enrich"><span class="fl-verify" data-status="pending">Enriching</span></span>
</div>
